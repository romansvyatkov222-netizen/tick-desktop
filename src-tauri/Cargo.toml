[package]
name = "tick"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Профиль release под минимальный размер .exe (ТЗ, п. 2 и 7)
[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
